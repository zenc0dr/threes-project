  dependencies: []
  acceptance_criteria:
    - Карточка отображает название, даты, цену, фото.
    - Макет адаптивен для всех устройств.
    - Стили соответствуют дизайн-системе.
    - Карточка загружается за 1 секунду.

- id: TASKUX-005.2
  title: Фотогалерея карточки
  description: Реализация фотогалереи в карточке круиза.
  module: Frontend
  category: UI/UX
  tags: [карточка, фотогалерея, интерфейс]
  parent_id: UX-005
  dependencies: [TASKUX-005.1]
  acceptance_criteria:
    - Фотогалерея поддерживает прокрутку изображений.
    - Изображения загружаются лениво (lazy loading).
    - Галерея адаптивна и кликабельна.
    - Галерея доступна для клавиатуры.

- id: TASKUX-005.3
  title: Кнопки действий карточки
  description: Добавление кнопок для добавления в избранное и корзину.
  module: Frontend
  category: UI/UX
  tags: [карточка, кнопки, интерфейс]
  parent_id: UX-005
  dependencies: [TASKUX-005.1]
  acceptance_criteria:
    - Кнопки "В избранное" и "В корзину" отображаются на карточке.
    - Клик на кнопку выполняет действие через AJAX.
    - Кнопки стилизованы по дизайн-системе.
    - Кнопки доступны для клавиатуры и экранных читалок.

- id: TASKUX-005.4
  title: Доступность карточки круиза
  description: Обеспечение доступности карточки круиза.
  module: Frontend
