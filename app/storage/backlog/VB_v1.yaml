  acceptance_criteria:
    - Карточка показывает название, даты, цену, фото и скидки.
    - Фотогалерея поддерживает прокрутку изображений.
    - Карточка адаптивна и загружается за 1 секунду.
    - Пользователь может добавить круиз в избранное или корзину.

- id: TASKUX-005.1
  title: Макет карточки круиза
