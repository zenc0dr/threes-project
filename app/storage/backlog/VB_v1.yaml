- id: TECH-001
  title: Аутентификация пользователей
  description: Реализация системы аутентификации для пользователей и администраторов.
  module: Backend
  category: Technical
  tags: [аутентификация, безопасность, сервер]
  parent_id: null
  dependencies: []
  acceptance_criteria:
    - Поддерживается вход через email/пароль и OAuth (Google, Яндекс).
    - Токены JWT генерируются для авторизованных пользователей.
    - Система защищена от brute-force атак.
    - Время авторизации не превышает 500 мс.

- id: TECHT-001.1
  title: Настройка JWT-аутентификации
  description: Реализация генерации и проверки JWT-токенов для аутентификации.
  module: Backend
  category: Technical
  tags: [аутентификация, jwt, сервер]
  parent_id: TECH-001
  dependencies: []
  acceptance_criteria:
    - JWT-токены генерируются при входе и имеют срок действия 24 часа.
    - Токены проверяются для всех защищённых эндпоинтов.
    - Проверка токена выполняется за 50 мс.
    - Неверные токены возвращают ошибку 401.

- id: TECHT-001.2
  title: Интеграция OAuth
  description: Настройка входа через OAuth (Google, Яндекс).
  module: Backend
  category: Technical
  tags: [аутентификация, oauth, сервер]
  parent_id: TECH-001
  dependencies: []
  acceptance_criteria:
    - Поддерживается вход через Google и Яндекс.
    - OAuth-токены конвертируются в JWT для внутренней авторизации.
    - Вход через OAuth выполняется за 1 секунду.
    - Ошибки OAuth логируются.

- id: TECHT-001.3
  title: Защита от brute-force
  description: Реализация защиты от атак перебора паролей.
  module: Backend
  category: Technical
  tags: [аутентификация, безопасность, сервер]
  parent_id: TECH-001
  dependencies: []
  acceptance_criteria:
    - Ограничивает 5 попыток входа за 5 минут с одного IP.
    - Блокирует IP на 15 минут после превышения лимита.
    - Попытки логируются.
    - Проверка выполняется за 50 мс.

- id: TECHT-001.4
  title: Тестирование аутентификации
  description: Проверка корректности работы системы аутентификации.
  module: Backend
  category: Technical
  tags: [аутентификация, тестирование, сервер]
  parent_id: TECH-001
  dependencies: [TECHT-001.1, TECHT-001.2, TECHT-001.3]
  acceptance_criteria:
    - Все сценарии входа (email, OAuth) работают корректно.
    - Защита от brute-force блокирует лишние попытки.
    - Тестирование выполняется за 5 минут.
    - Ошибки логируются и исправляются.

