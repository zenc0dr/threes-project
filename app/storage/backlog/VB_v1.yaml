- id: API-001
  title: API поиска круизов
  description: Реализация API для обработки поисковых запросов круизов с поддержкой фильтров, сортировки и пагинации.
  module: Backend
  category: API
  tags: [поиск, api, сервер]
  parent_id: null
  dependencies: []
  acceptance_criteria:
    - API принимает параметры фильтров (город, даты, теплоход, тип круиза).
    - API возвращает результаты в формате JSON за 500 мс.
    - Поддерживает сортировку по цене, длительности, дате отправления.
    - Поддерживает пагинацию (10 результатов на страницу).

- id: APITASK001.1
  title: Эндпоинт поиска круизов
  description: Разработка эндпоинта для получения списка круизов по фильтрам.
  module: Backend
  category: API
  tags: [поиск, эндпоинт, сервер]
  parent_id: API-001
  dependencies: []
  acceptance_criteria:
