  parent_id: UX-005
  dependencies: [TASKUX-005.1, TASKUX-005.2, TASKUX-005.3]
  acceptance_criteria:
    - Карточка соответствует WCAG 2.1 (AA).
    - Все элементы (фото, кнопки) доступны через клавиатуру.
    - Экранные читалки корректно интерпретируют контент.
    - Контрастность элементов соответствует стандартам.

