- id: ANT-004.1
  title: Отчёт по посещениям
  description: Настройка генерации отчёта по посещениям страниц.
  module: Backend
  category: Analytics
  tags: [аналитика, отчёты, посещения]
  parent_id: AN-004
  dependencies: []
  acceptance_criteria:
    - Отчёт показывает посещения по страницам (круизы, теплоходы).
    - Отчёт включает источники трафика и время на сайте.
    - Генерация выполняется за 5 секунд.
    - Отчёт доступен только админам.

- id: ANT-004.2
  title: Отчёт по событиям
  description: Настройка генерации отчёта по пользовательским событиям.
  module: Backend
  category: Analytics
  tags: [аналитика, отчёты, события]
  parent_id: AN-004
  dependencies: []
  acceptance_criteria:
    - Отчёт показывает клики, поиски, добавления в избранное.
    - Отчёт включает параметры событий (ID круиза, даты).
    - Генерация выполняется за 5 секунд.
    - Отчёт доступен только админам.

- id: ANT-004.3
  title: Отчёт по конверсиям
  description: Настройка генерации отчёта по конверсиям.
  module: Backend
  category: Analytics
  tags: [аналитика, отчёты, конверсии]
  parent_id: AN-004
  dependencies: []
  acceptance_criteria:
    - Отчёт показывает бронирования и отзывы.
    - Отчёт включает суммы бронирований и ID круизов.
    - Генерация выполняется за 5 секунд.
    - Отчёт доступен только админам.

- id: ANT-004.4
  title: Тестирование отчётов
  description: Проверка корректности генерации аналитических отчётов.
  module: Backend
  category: Analytics
  tags: [аналитика, отчёты, тестирование]
  parent_id: AN-004
  dependencies: [ANT-004.1, ANT-004.2, ANT-004.3]
  acceptance_criteria:
    - Все отчёты генерируются корректно.
    - Данные в отчётах совпадают с Метрикой.
    - Тестирование выполняется за 30 минут.
    - Доступ к отчётам ограничен админами.
