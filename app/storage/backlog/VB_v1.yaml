- id: UX-001
  title: Функционал избранного
  description: Реализация возможности добавления/удаления круизов в избранное с визуальными индикаторами и страницей избранного.
  module: Frontend
  category: UI/UX
  tags: [избранное, взаимодействие, интерфейс]
  parent_id: null
  dependencies: []
  acceptance_criteria:
    - Пользователь может добавлять/удалять круизы через иконку-сердце.
    - Индикатор (заполненное/пустое сердце) обновляется без перезагрузки.
    - Страница избранного отображает круизы с названием, датами, ценой.
    - Избранное сохраняется для авторизованных пользователей.

- id: TASKUX-001.1
  title: Иконка избранного
  description: Добавление интерактивной иконки-сердца на карточки круизов.
  module: Frontend
  category: UI/UX
  tags: [избранное, иконка, javascript]
  parent_id: UX-001
  dependencies: []
  acceptance_criteria:
    - Иконка-сердце отображается на всех карточках круизов в поиске и на страницах.
    - Клик переключает статус (заполненное/пустое сердце) через AJAX за 300 мс.
    - Иконка доступна для клавиатуры и экранных читалок (ARIA-метки).
    - Стили иконки соответствуют дизайн-системе.

- id: TASKUX-001.2
  title: Страница избранного
  description: Создание страницы для отображения всех избранных круизов.
  module: Frontend
  category: UI/UX
  tags: [избранное, страница, интерфейс]
  parent_id: UX-001
  dependencies: []
  acceptance_criteria:
    - Страница показывает круизы с миниатюрой, названием, датами, ценой.
    - Пользователь может удалить круиз из избранного на странице.
    - Страница загружается за 2 секунды и адаптивна.
    - Пустое избранное отображает дружелюбное сообщение.

- id: TASKUX-001.3
  title: Уведомления избранного
  description: Реализация уведомлений при добавлении/удалении круизов в избранное.
  module: Frontend
  category: UI/UX
  tags: [избранное, уведомления, интерфейс]
  parent_id: UX-001
  dependencies: [TASKUX-001.1]
  acceptance_criteria:
    - Уведомление появляется при добавлении/удалении круиза.
    - Уведомление исчезает через 3 секунды.
    - Уведомление доступно для экранных читалок.
    - Стили соответствуют дизайн-системе.

- id: TASKUX-001.4
  title: Счётчик избранного
  description: Добавление счётчика избранных круизов в шапке сайта.
  module: Frontend
  category: UI/UX
  tags: [избранное, счётчик, интерфейс]
  parent_id: UX-001
  dependencies: [TASKUX-001.1]
  acceptance_criteria:
    - Счётчик показывает количество избранных круизов.
    - Счётчик обновляется в реальном времени.
    - Счётчик кликабелен и ведёт на страницу избранного.
    - Счётчик скрыт при нулевом значении.

- id: TASKUX-001.5
  title: Доступность избранного
  description: Обеспечение доступности функционала избранного для пользователей с ограниченными возможностями.
  module: Frontend
  category: UI/UX
  tags: [избранное, доступность, интерфейс]
  parent_id: UX-001
  dependencies: [TASKUX-001.1, TASKUX-001.2, TASKUX-001.3]
  acceptance_criteria:
    - Иконка, страница и уведомления поддерживают WCAG 2.1 (уровень AA).
    - Элементы доступны через клавиатуру (Tab, Enter).
    - Экранные читалки корректно интерпретируют действия.
    - Контрастность элементов соответствует стандартам.

- id: UX-002
  title: Отметка просмотренных круизов
  description: Реализация отметки просмотренных круизов с визуальным индикатором.
  module: Frontend
  category: UI/UX
  tags: [просмотрено, отслеживание, интерфейс]
  parent_id: null
  dependencies: []
  acceptance_criteria:
    - Просмотренные круизы помечаются значком "Просмотрено" в поиске.
    - Отметка сохраняется 30 дней через cookies.
    - Значок не перекрывает другие элементы интерфейса.
    - Пользователи могут очистить историю просмотров.

- id: TASKUX-002.1
  title: Значок просмотренных круизов
  description: Добавление значка "Просмотрено" на карточки круизов.
  module: Frontend
  category: UI/UX
  tags: [просмотрено, иконка, интерфейс]
  parent_id: UX-002
  dependencies: []
  acceptance_criteria:
    - Значок отображается на просмотренных карточках в результатах поиска.
    - Значок стилизован по дизайн-системе.
    - Значок доступен для экранных читалок (ARIA).
    - Значок не мешает взаимодействию с карточкой.

- id: TASKUX-002.2
  title: Кнопка очистки просмотров
  description: Реализация кнопки для очистки истории просмотренных круизов.
  module: Frontend
  category: UI/UX
  tags: [просмотрено, кнопка, интерфейс]
  parent_id: UX-002
  dependencies: []
  acceptance_criteria:
    - Кнопка доступна в профиле пользователя.
    - Клик удаляет все отметки "Просмотрено".
    - Пользователь получает уведомление об очистке.
    - Кнопка доступна для клавиатуры.

- id: TASKUX-002.3
  title: Доступность просмотренных круизов
  description: Обеспечение доступности функционала просмотренных круизов.
  module: Frontend
  category: UI/UX
  tags: [просмотрено, доступность, интерфейс]
  parent_id: UX-002
  dependencies: [TASKUX-002.1, TASKUX-002.2]
  acceptance_criteria:
    - Значок и кнопка очистки соответствуют WCAG 2.1 (AA).
    - Элементы доступны через клавиатуру.
    - Экранные читалки корректно интерпретируют элементы.
    - Контрастность элементов соответствует стандартам.

- id: UX-003
  title: Главная страница
  description: Реализация главной страницы с баннером, виджетом поиска и переключателем типов круизов.
  module: Frontend
  category: UI/UX
  tags: [главная, баннер, поиск, интерфейс]
  parent_id: null
  dependencies: []
  acceptance_criteria:
    - Страница включает баннер, виджет поиска, переключатель речные/морские круизы.
    - Логотипы партнёров кликабельны и ведут на их страницы.
    - Страница загружается за 2 секунды и адаптивна.
    - Переключатель обновляет контент без перезагрузки.

- id: TASKUX-003.1
  title: Макет главной страницы
  description: Создание макета главной страницы с баннером, поиском и футером.
  module: Frontend
  category: UI/UX
  tags: [главная, макет, интерфейс]
  parent_id: UX-003
  dependencies: []
  acceptance_criteria:
    - Макет включает баннер, виджет поиска, переключатель, футер.
    - Макет адаптивен для мобильных и десктопных устройств.
    - Стили соответствуют дизайн-системе.
    - Макет загружается за 2 секунды.

- id: TASKUX-003.2
  title: Переключатель типов круизов
  description: Реализация переключателя для речных и морских круизов.
  module: Frontend
  category: UI/UX
  tags: [главная, переключатель, интерфейс]
  parent_id: UX-003
  dependencies: [TASKUX-003.1]
  acceptance_criteria:
    - Переключатель позволяет выбрать речные или морские круизы.
    - Активный тип визуально выделен (например, подчёркивание).
    - Переключатель обновляет виджет поиска без перезагрузки.
    - Переключатель доступен для клавиатуры и экранных читалок.

- id: TASKUX-003.3
  title: Баннер главной страницы
  description: Добавление интерактивного баннера на главную страницу.
  module: Frontend
  category: UI/UX
  tags: [главная, баннер, интерфейс]
  parent_id: UX-003
  dependencies: [TASKUX-003.1]
  acceptance_criteria:
    - Баннер отображает изображение и призыв к действию.
    - Баннер кликабелен и ведёт на страницу поиска.
    - Баннер адаптивен и загружается за 1 секунду.
    - Баннер поддерживает WCAG 2.1 (AA).

- id: TASKUX-003.4
  title: Логотипы партнёров
  description: Реализация кликабельных логотипов партнёров на главной странице.
  module: Frontend
  category: UI/UX
  tags: [главная, логотипы, интерфейс]
  parent_id: UX-003
  dependencies: [TASKUX-003.1]
  acceptance_criteria:
    - Логотипы отображаются в секции партнёров.
    - Каждый логотип кликабелен и ведёт на страницу партнёра.
    - Логотипы адаптивны и не обрезаются.
    - Логотипы доступны для экранных читалок.

- id: TASKUX-003.5
  title: Доступность главной страницы
  description: Обеспечение доступности главной страницы.
  module: Frontend
  category: UI/UX
  tags: [главная, доступность, интерфейс]
  parent_id: UX-003
  dependencies: [TASKUX-003.1, TASKUX-003.2, TASKUX-003.3, TASKUX-003.4]
  acceptance_criteria:
    - Страница соответствует WCAG 2.1 (AA).
    - Все элементы (баннер, переключатель, логотипы) доступны через клавиатуру.
    - Экранные читалки корректно интерпретируют контент.
    - Контрастность элементов соответствует стандартам.

- id: UX-004
  title: Шапка сайта
  description: Реализация закреплённой шапки с меню, логотипом и счётчиками.
  module: Frontend
  category: UI/UX
  tags: [шапка, меню, интерфейс]
  parent_id: null
  dependencies: []
  acceptance_criteria:
    - Шапка фиксируется при прокрутке.
    - Логотип ведёт на главную страницу.
    - Шапка адаптивна и содержит мобильное меню.
    - Счётчики (избранное, корзина) обновляются в реальном времени.

- id: TASKUX-004.1
  title: Макет шапки
  description: Создание макета закреплённой шапки с логотипом и меню.
  module: Frontend
  category: UI/UX
  tags: [шапка, макет, интерфейс]
  parent_id: UX-004
  dependencies: []
  acceptance_criteria:
    - Шапка фиксируется при прокрутке страницы.
    - Логотип отображается слева и кликабелен.
    - Макет адаптивен для всех устройств.
    - Стили соответствуют дизайн-системе.

- id: TASKUX-004.2
  title: Мобильное меню
  description: Реализация мобильного меню в шапке.
  module: Frontend
  category: UI/UX
  tags: [шапка, меню, интерфейс]
  parent_id: UX-004
  dependencies: [TASKUX-004.1]
  acceptance_criteria:
    - Мобильное меню открывается по клику на иконку-гамбургер.
    - Меню закрывается при клике вне области.
    - Меню адаптивно и доступно для клавиатуры.
    - Анимация открытия/закрытия плавная (менее 300 мс).

- id: TASKUX-004.3
  title: Счётчики в шапке
  description: Добавление счётчиков избранного и корзины в шапке.
  module: Frontend
  category: UI/UX
  tags: [шапка, счётчики, интерфейс]
  parent_id: UX-004
  dependencies: [TASKUX-004.1]
  acceptance_criteria:
    - Счётчики показывают количество элементов в избранном и корзине.
    - Счётчики обновляются в реальном времени.
    - Счётчики кликабельны и ведут на соответствующие страницы.
    - Счётчики скрыты при нулевом значении.

- id: TASKUX-004.4
  title: Доступность шапки
  description: Обеспечение доступности шапки и её элементов.
  module: Frontend
  category: UI/UX
  tags: [шапка, доступность, интерфейс]
  parent_id: UX-004
  dependencies: [TASKUX-004.1, TASKUX-004.2, TASKUX-004.3]
  acceptance_criteria:
    - Шапка соответствует WCAG 2.1 (AA).
    - Логотип, меню и счётчики доступны через клавиатуру.
    - Экранные читалки корректно интерпретируют элементы.
    - Контрастность элементов соответствует стандартам.

